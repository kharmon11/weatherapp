name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: server
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend test suite
        working-directory: server
        env:
          GOOGLE_MAPS_GEOCODING_KEY: test-google-key
          OPENWEATHERMAP_API_KEY: test-owm-key
        run: pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run frontend test suite
        working-directory: client
        run: pnpm test

  deploy:
    name: Deploy to App Engine
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      # `pnpm run build` type-checks, runs `vite build`, then runs `copy-dist`
      # itself (see client/package.json) - this is the same command used
      # for local deploys, so server/app/dist ends up populated identically.
      - name: Build frontend
        working-directory: client
        run: pnpm run build

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # app.yaml is gitignored (it holds real secrets locally) and is never
      # committed, so it doesn't exist in this checkout. Render it here from
      # the committed template, substituting real values from GitHub
      # secrets/variables. See server/app.yaml.template.
      - name: Render app.yaml from template
        working-directory: server
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          GOOGLE_MAPS_GEOCODING_KEY: ${{ secrets.GOOGLE_MAPS_GEOCODING_KEY }}
        run: envsubst < app.yaml.template > app.yaml

      - name: Deploy to App Engine
        uses: google-github-actions/deploy-appengine@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          working_directory: server
          deliverables: app.yaml
