name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: server
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run backend test suite
        working-directory: server
        env:
          GOOGLE_MAPS_GEOCODING_KEY: test-google-key
          OPENWEATHERMAP_API_KEY: test-owm-key
        run: pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Run frontend test suite
        working-directory: client
        run: pnpm test

  deploy:
    name: Deploy to App Engine
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      # `pnpm run build` type-checks, runs `vite build`, then runs `copy-dist`
      # itself (see client/package.json) - this is the same command used
      # for local deploys, so server/app/dist ends up populated identically.
      # Vite bakes VITE_* vars into the bundle at build time (see
      # client/.env.production, which is gitignored and never exists in CI),
      # and client/src/utils/validateEnv.ts throws at runtime if any of the
      # ones below are missing, so they must be supplied here. VITE_API_BASE_URL
      # is deliberately NOT set here: leaving it unset makes the frontend call
      # its own origin instead of a fixed domain (see weatherService.ts), which
      # works correctly for every deployed environment, promoted or candidate.
      - name: Build frontend
        working-directory: client
        env:
          VITE_GOOGLE_MAPS_JAVASCRIPT_KEY: ${{ secrets.VITE_GOOGLE_MAPS_JAVASCRIPT_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}
        run: pnpm run build

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # app.yaml is gitignored (it holds real secrets locally) and is never
      # committed, so it doesn't exist in this checkout. Render it here from
      # the committed template, substituting real values from GitHub
      # secrets/variables. See server/app.yaml.template.
      - name: Render app.yaml from template
        working-directory: server
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          OPENWEATHERMAP_API_KEY: ${{ secrets.OPENWEATHERMAP_API_KEY }}
          GOOGLE_MAPS_GEOCODING_KEY: ${{ secrets.GOOGLE_MAPS_GEOCODING_KEY }}
        run: envsubst < app.yaml.template > app.yaml

      - name: Compute deploy version
        id: version
        run: echo "version=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Deploy to App Engine
        id: deploy
        uses: google-github-actions/deploy-appengine@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          working_directory: server
          deliverables: app.yaml
          version: ${{ steps.version.outputs.version }}
          promote: false

      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Runs against the version deployed above, which is not yet receiving
      # any live traffic (promote: false) - a failure here leaves the
      # currently-live version serving weather.kenharmon.net untouched.
      - name: Smoke test deployed version
        working-directory: client
        run: node scripts/smoke-test.mjs "${{ steps.deploy.outputs.version_url }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Only reached if the smoke test step above succeeded - GitHub Actions
      # skips remaining steps in a job by default once a prior step fails.
      - name: Promote version to live traffic
        run: |
          gcloud app services set-traffic default \
            --splits="${{ steps.deploy.outputs.version_id }}=1" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --quiet

  deploy-cloud-run:
    name: Deploy to Cloud Run
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGION: us-central1
      SERVICE: weatherapp
      IMAGE: ${{ vars.ARTIFACT_REGISTRY_PATH }}:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            -f server/Dockerfile \
            --build-arg VITE_GOOGLE_MAPS_JAVASCRIPT_KEY="${{ secrets.VITE_GOOGLE_MAPS_JAVASCRIPT_KEY }}" \
            --build-arg VITE_GOOGLE_MAPS_MAP_ID="${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}" \
            --build-arg VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID="${{ vars.VITE_GOOGLE_ANALYTICS_MEASUREMENT_ID }}" \
            -t "$IMAGE" \
            .

      - name: Push image
        run: docker push "$IMAGE"

      # ALLOWED_ORIGINS contains commas, which gcloud would treat as the
      # separator between env vars, so a custom delimiter (^@^) is required.
      - name: Deploy candidate revision (no traffic)
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --service-account="${{ vars.RUNTIME_SA_EMAIL }}" \
            --set-env-vars="^@^ENV=production@ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}" \
            --set-secrets=OPENWEATHERMAP_API_KEY=weatherapp-openweathermap-key:latest,GOOGLE_MAPS_GEOCODING_KEY=weatherapp-geocoding-key:latest \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --no-traffic \
            --tag=candidate

      - name: Get candidate URL
        id: candidate
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --region="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format=json | jq -r '.status.traffic[] | select(.tag=="candidate") | .url')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      # Unchanged script; only the URL differs. A failure here skips promotion
      # and leaves the live revision serving all traffic.
      - name: Smoke test candidate revision
        working-directory: client
        run: node scripts/smoke-test.mjs "${{ steps.candidate.outputs.url }}"

      - name: Promote to 100% traffic
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region="$REGION" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --to-latest

      # Image retention is deliberately not handled in this pipeline: set an
      # Artifact Registry cleanup policy on the repository instead.
